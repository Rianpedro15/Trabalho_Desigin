
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="./src/img/icon1.png" class="icon-navegador">
    
    <title>Trabalho</title>
     <link rel="stylesheet" href="./src/css/inicial.css">
</head>
<body>

    <header>
        <!--Cabecalho do site (PARTE SUPERIOR)-->
        <div class="cabecalho">

            <div>
                <img src="./src/img/icon1.png" id="icon" alt="Icone do site" width="50" height="50">
                <!--foto do icone do site-->

            </div>

            <div class="pesquisa">
            <input type="text" placeholder="Pesquisar...">
                <button type="button">
                     <i class="bi bi-search-heart"></i>
                </button>
                <!--Barra de pesquisa do site-->

            </div>

            <div class="icones">
                <!--Icone do login-->
                <div>
                    <a href="index.html">
                        <i class="bi bi-person-circle"></i>
                    </a>
                </div>

                <div>
                    <!--Icone de favoritos-->
                    <a href="#">
                        <i class="bi bi-heart"></i>
                    </a>
                </div>
                <!--<img src="src/img/lupa.png" alt="">-->

            
            </div>
        </div>
        <!--PARTE INFERIOR DO HEADER-->
        <nav id="filtro">
            <!--Navegação dos tipos de comidas (jogos, animes, cartoon)-->
            <a href="#">Jogos</a>
            <a href="#">Animes</a>
            <a href="#">Cartoon</a>
            <a href="#">Filmes</a>

        </nav>
        
    </header>

    <main>
        <div class="slogan">
            <!--onde vai ficar a apresentação do site-->

            <div>
                <img src ="./src/img/Jacquin.png" id="foto_jacquin" alt ="Imagem do Jacquin">
                <!--foto do site, jaquin-->

            </div>

            <div>
                <p>Quem come de tudo, está sempre mastigando</p>
            </div>

        </div><br>

        <hr class="linha-divisoria">

        <div class="blocos">
            <!-- Div para poder estruturar os blocos dos pratos-->
            
            <!--PRIMEIRO PRATO PARA TESTE DO DESIGN-->
            <div class="card-prato">
                <div class="img_prato">
                    <!--Responsável pelo Design da imagem dos pratos-->
                    <img src="./src/img/pratos/butterbeer.png" alt="Imagem do prato">
                </div>

                <div class="informacoes-prato">
                    <div class="textos">
                        <!--Responsavel pelo Design do texto (Nomes, filtro, inspiração)-->
                        <h1>Nome do prato</h1><br>
                        <p>Desenho</p>

                    </div>
                    <div id="avaliacao">
                        <!--Responsavel pelo Desing das avaliações dos pratos-->
                        <p>⭐⭐⭐⭐⭐</p>
                    </div>

                    <div id="botao-receita">
                        <!--Responsavel pelo Design do botão-->
                        <a href="receita.html" class="botao-receita">
                            Ir para a receita
                        </a>

                    </div>
                </div>
            </div>

            <!--SEGUNDO PRATO PARA TESTE DO DESIGN-->  
            <div class="card-prato">
                <div class="img_prato">
                    <!--Responsável pelo Design da imagem dos pratos-->
                    <img src="./src/img/pratos/lamen.png" alt="Imagem do prato"> 
                </div>

                <div class="informacoes-prato">
                    <div class="textos">
                        <!--Responsavel pelo Design do texto (Nomes, filtro, inspiração)-->
                        <h1>Nome do prato</h1><br>
                        <p>Desenho</p>

                    </div>
                    <div id="avaliacao">
                        <!--Responsavel pelo Desing das avaliações dos pratos-->
                        <p>⭐⭐⭐⭐</p>
                    </div>

                    <div id="botao-receita">
                        <!--Responsavel pelo Design do botão-->
                        <a href="receita.html" class="botao-receita">
                            Ir para a receita
                        </a>

                    </div>
                </div>
            </div>    
        </div>


    </main>

    <footer>
        <!--Rodapé do site-->
        <div id="direitos_autorais">
            <!--Responsável pelo design dos direitos autorais-->
            <p>©nome do site</p>
        </div>
            <!--Responsavel pelo Design dos contatos-->
            <nav id="contatos">
                <ul>
                    <li>
                        <a href="#">
                            <i class="bi bi-envelope-open-heart"></i>
                            <p>Entre em contato por email</p>
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="bi bi-instagram"></i>
                            <p>Siga-nos no Instagram</p>
                        </a>
                    </li>
                </ul>
            </nav>
        
        <div id="ia">
            <!--Responsavel pelo Design da IA do site-->
            <img src="./src/img/Jacquin.png" alt="IA do site">
        </div>   

    </footer>
   
</body>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
