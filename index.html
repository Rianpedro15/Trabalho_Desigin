
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho</title>
     <link rel="stylesheet" href="./src/css/inicial.css">
</head>
<body>

    <header>
        <!--Cabecalho do site-->

        <div id="icon">
            <img src="src/img/icon.png" alt="Icone do site" width="50" height="50">
            <!--foto do icone do site-->

        </div>

        <div class="pesquisa">
        <input type="text" placeholder="Pesquisar...">
        <button>🔍</button>
            <!--Barra de pesquisa do site-->

        </div>

        <div id="login">
            <!--Icone do login-->
            <img src="src/img/login.png" alt="Icone do login" width="50" height="50">

            <img src="#" alt="icone de favoritos" width="50" height="50">

           <!--<img src="src/img/lupa.png" alt="">-->

        
        </div>

        <nav id="filtro">
            <!--Navegação dos tipos de comidas (jogos, animes, cartoon)-->
            <a href="#">Jogos</a>
            <a href="#">Animes</a>
            <a href="#">Cartoon</a>

        </nav>

    </header>

    <main>
        <div class="slogan">
            <!--onde vai ficar a apresentação do site-->

            <div>
                <img src ="" id="foto_principal" alt ="Imagem do Jacquin" width="300" height="300">
                <!--foto do site, jaquin pelado-->
                <p>quem come de tudo, está sempre mastigando</p>

            </div>

        </div><br>

        <div class="blocos">
            <!-- Div para poder estruturar os blocos dos pratos-->

            <div id="img_prato">
                <!--Responsável pelo Design da imagem dos pratos-->
                <img src="#" alt="Imagem do prato" width="300" height="300">
            </div>

            <div id="botao-receita">
                <!--Responsavel pelo Design do botão-->
                <a href="receita.html" class="botao-receita">
                    <button>
                    Ir para a receita
                    </button>
                </a>

            </div>
            <div id="textos">
                <!--Responsavel pelo Design do texto (Nomes, filtro, inspiração)-->
                <h1>Nome do prato</h1><br>
                <p>Desenho</p>

            </div>
            <div id="avaliacao">
                <!--Responsavel pelo Desing das avaliações dos pratos-->
                <p>⭐⭐⭐⭐⭐</p>
            </div>

        </div>


    </main>

    <footer>
        <!--Rodapé do site-->
        <div id="direitos_autorais">
            <!--Responsável pelo design dos direitos autorais-->
            <p>©nome do site</p>
        </div>
        <div>
            <!--Responsavel pelo Design dos contatos-->
            <nav id="contatos">
                <ul>
                    <li><a href="#"><img src="src/img/zapzap.png" alt="contate-nos no Whattsap" width="30" height="30"></a></li>
                    <li><a href="#"><img src="src/img/email.png" alt="contate-nos no email" width="30" height="30"></a></li>
                </ul>
            </nav>
        </div>
    </footer>
   
</body>
</html>
